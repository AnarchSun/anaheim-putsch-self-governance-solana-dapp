[workspace]
members = [
  "programs/anaheim",
  "programs/quadratic",
  "programs/realm-voter",
  "programs/token-voter"
]
resolver = "2"

[profile.release]
overflow-checks = true
opt-level = "s"
lto = true
codegen-units = 1

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/solana-labs/curve25519-dalek.git", rev = "c14774464c4d38de553c6ef2f48a10982c1b4801" }
regex-automata = { path = "programs/patched_crates/regex-automata" }