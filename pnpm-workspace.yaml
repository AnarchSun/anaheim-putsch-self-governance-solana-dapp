packages:
  - src/*
  - src/components/*
  - apps/*
  - packages/*
  - anchor
  - src/app/**"

allowBuilds:
  '@stellar/stellar-sdk': true
  bigint-buffer: true
  blake-hash: true
  bufferutil: true
  esbuild: true
  keccak: true
  protobufjs: true
  secp256k1: true
  sharp: true
  tiny-secp256k1: true
  usb: true
  utf-8-validate: true

catalogs:
  react16:
    react: ^16.7.0
    react-dom: ^16.7.0
  react17:
    react: ^17.10.0
    react-dom: ^17.10.0

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - bigint-buffer
  - blake-hash
  - buffer utils
  - bufferutil
  - esbuild
  - protobufjs
  - sharp
  - tailwindcss/oxide
  - tiny-secp256k1
  - unrest-resolver
  - unrs-resolver
  - usb
  - utf-8-validate
